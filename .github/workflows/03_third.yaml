name: variable_workflow
on:
  - push
env:
  DOCKER_REGISTRY: docker.io
  DOCKER_REPO: user
jobs:
  build:
    name: my_build_job
    runs-on: ubuntu-latest
    
    steps:
    
    - name: docker build
      run: echo docker build -t $DOCKER_REGISTRY/${{vars.DOCKER_USERNAME}}/$DOCKER_REPO:latest

    - name: docker login 
      run: echo docker login --username=${{vars.DOCKER_USERNAME}} --password=${{secrets.DOCKER_PASSWORD}}
