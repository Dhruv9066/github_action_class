name: variable_workflow
on:
  - push
jobs:
  build:        
    name: my_build_job
    runs-on: ubuntu-latest
    steps:
    - name: docker build
      run: echo docker build -t $DOCKER_REGISTRY/$DOCKER_USERNAME/$DOCKER_REPO:latest
      env:
        DOCKER_REGISTRY: docker.io
        DOCKER_USERNAME: dhruv9066
        DOCKER_REPO: user
    - name: docker login 
      env:
        DOCKER_PASSWORD: dhruv
        DOCKER_USERNAME: dhruv9066
      run: echo docker login --username=$DOCKER_USERNAME --password=$DOCKER_PASSWORD
          

        
