name: my_workflow
on:
  - push
jobs:
  build:
    name: build job
    runs-on: ubuntu-latest
    steps:
      - name: checkout action
        uses: actions/checkout@v7

      - name: Installig cowsay
        run: sudo apt-get install cowsay -y
        
      - name: working with cowsay 
        run: |
          cowsay -f dragon "Run for the cover, save me dhruv" > dragon.txt
          cat dragon.txt
  test:
    name: 
    runs-on: ubuntu-latest
    steps:
      - name: Hello from test
        run: echo "Hello from test job "
